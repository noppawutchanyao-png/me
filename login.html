<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - Laundry Fresh Service</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .bubble-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -80px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.6), 0 4px 15px rgba(0, 150, 255, 0.15);
            animation: floatUp ease-in infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translateY(-115vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 20px 50px rgba(14, 116, 144, 0.25);
        }

        @keyframes spinDrum {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spin-drum {
            animation: spinDrum 7s linear infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-icon {
            animation: floatSlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-400 via-cyan-500 to-blue-600 flex items-center justify-center p-4 relative overflow-hidden">

    <div class="bubble-container" id="bubbleContainer"></div>

    <div class="absolute -top-20 -left-20 w-80 h-80 bg-cyan-200/40 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 z-10 my-auto transition-all duration-300 hover:shadow-cyan-500/20">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="relative inline-flex items-center justify-center mb-3">
                <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-sky-400 to-cyan-300 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/30 float-icon">
                    <div class="w-16 h-16 sm:w-18 sm:h-18 bg-white rounded-2xl flex flex-col items-center justify-center relative shadow-inner p-2 border border-cyan-100">
                        <div class="w-full flex justify-between items-center mb-1 px-1">
                            <div class="w-2 h-2 rounded-full bg-cyan-400"></div>
                            <div class="flex gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                            </div>
                        </div>
                        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full border-4 border-cyan-200 bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center relative overflow-hidden shadow-md">
                            <div class="absolute inset-0 bg-white/20 rounded-full transform -rotate-45"></div>
                            <div class="spin-drum text-white text-xs opacity-90 flex items-center justify-center">
                                <i class="fa-solid fa-arrows-spin text-lg sm:text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>
                
                <span class="absolute -top-1 -right-1 bg-amber-300 text-amber-900 text-xs font-bold px-2.5 py-0.5 rounded-full shadow-md border border-white flex items-center gap-1 animate-bounce">
                    <i class="fa-solid fa-sparkles text-amber-600"></i> Fresh
                </span>
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-cyan-700 via-sky-800 to-blue-900 bg-clip-text text-transparent">
                Fresh Laundry
            </h1>
            <p class="text-sm text-cyan-800 font-medium mt-1">
                ระบบจัดการบริการซักรีด
            </p>
        </div>

        <!-- Login Form (เชื่อมไปที่ login.php) -->
        <form id="loginForm" action="login.php" method="POST" onsubmit="return handleLogin(event)" class="space-y-5">
            
            <!-- Input 1: User -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">
                    ชื่อผู้ใช้ (User)
                </label>
                <div class="relative flex items-center">
                    <div class="absolute left-4 text-cyan-500 text-base pointer-events-none">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <!-- name="user" ให้ตรงกับ login.php -->
                    <input 
                        type="text" 
                        id="username" 
                        name="user"
                        placeholder="กรอกชื่อผู้ใช้" 
                        required
                        class="w-full pl-11 pr-4 py-3.5 bg-white/90 border border-cyan-200/80 rounded-2xl text-slate-800 placeholder-slate-400 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all shadow-sm"
                    >
                </div>
                <p id="usernameError" class="hidden text-xs text-rose-500 mt-1 ml-1 font-medium">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i>กรุณากรอกชื่อผู้ใช้
                </p>
            </div>

            <!-- Input 2: Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">
                    รหัสผ่าน (Password)
                </label>
                <div class="relative flex items-center">
                    <div class="absolute left-4 text-cyan-500 text-base pointer-events-none">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <!-- name="password" -->
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="กรอกรหัสผ่าน" 
                        required
                        class="w-full pl-11 pr-12 py-3.5 bg-white/90 border border-cyan-200/80 rounded-2xl text-slate-800 placeholder-slate-400 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all shadow-sm"
                    >
                    <button 
                        type="button" 
                        id="togglePasswordBtn"
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3.5 text-slate-400 hover:text-cyan-600 focus:outline-none p-1.5 rounded-lg transition-colors"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
                <p id="passwordError" class="hidden text-xs text-rose-500 mt-1 ml-1 font-medium">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i>กรุณากรอกรหัสผ่าน
                </p>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="loginBtn"
                class="w-full py-3.5 px-6 mt-2 bg-gradient-to-r from-sky-500 via-cyan-500 to-blue-600 hover:from-sky-600 hover:via-cyan-600 hover:to-blue-700 text-white font-bold text-base sm:text-lg rounded-2xl shadow-lg shadow-cyan-500/35 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer"
            >
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    เข้าสู่ระบบ
                </span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-cyan-100/60 pt-4">
            <p class="text-xs text-cyan-800/80 font-medium flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-cyan-600"></i>
                ระบบซักรีดปลอดภัย หอมสะอาด มั่นใจทุกชิ้น
            </p>
        </div>
    </main>

    <script>
        function createBubbles() {
            const container = document.getElementById('bubbleContainer');
            const bubbleCount = 15;

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.floor(Math.random() * 40) + 15;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                const duration = Math.random() * 6 + 6;
                const delay = Math.random() * 5;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.animationDelay = `${delay}s`;
                container.appendChild(bubble);
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleLogin(event) {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            
            let isValid = true;

            if (!usernameInput.value.trim()) {
                usernameError.classList.remove('hidden');
                usernameInput.classList.add('border-rose-400', 'bg-rose-50/30');
                isValid = false;
            } else {
                usernameError.classList.add('hidden');
                usernameInput.classList.remove('border-rose-400', 'bg-rose-50/30');
            }

            if (!passwordInput.value.trim()) {
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-rose-400', 'bg-rose-50/30');
                isValid = false;
            } else {
                passwordError.classList.add('hidden');
                passwordInput.classList.remove('border-rose-400', 'bg-rose-50/30');
            }

            if (!isValid) {
                event.preventDefault();
                return false;
            }

            return true; // อนุญาตให้ส่งค่าไป login.php
        }

        window.addEventListener('DOMContentLoaded', createBubbles);
    </script>
</body>
</html>
